name: Build and Release Daily Tasks APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Rename APK with version and timestamp
        run: |
          VERSION_NAME=${{ github.ref_name }}
          BUILD_NUMBER=${{ github.run_number }}
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          APK_NAME="DailyTasks_${VERSION_NAME//\//-}_v2_${TIMESTAMP}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v3
        with:
          name: DailyTasks-APK
          path: ${{ env.APK_NAME }}
          retention-days: 30

  release:
    name: Release APK
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      packages: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v3
        with:
          name: DailyTasks-APK

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: '*.apk'
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## Daily Tasks App - Release ${{ github.ref_name }}

            ### What's New
            - ✅ Multi-language support (English, Arabic, French, Spanish)
            - ✅ Priority levels (High, Medium, Low)
            - ✅ Recurring tasks (Daily, Weekly, Monthly, Yearly, Custom)
            - ✅ Backup & Restore (Local JSON)
            - ✅ Advanced search
            - ✅ File attachments
            - ✅ Advanced statistics
            - ✅ GitHub Actions CI/CD

            ### Developer
            **Adam Dev (DARK SHINRA)**
            All rights reserved © 2026
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
